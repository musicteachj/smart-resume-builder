openapi: 3.0.3
info:
  title: Smart Resume Builder API
  version: 0.1.0
  description: AI-powered resume builder — resumes, auth, and Claude-assisted content.
paths:
  /api/ai/ats-check:
    post:
      operationId: ats_health_check
      description: |-
        Base for AI endpoints: auth required + a per-user burst throttle (complements
        the per-user daily/monthly quota in usage.py).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtsCheckRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AtsCheckRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AtsCheckRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtsCheckResponse'
          description: ''
  /api/ai/cover-letter:
    post:
      operationId: generate_cover_letter
      description: |-
        Base for AI endpoints: auth required + a per-user burst throttle (complements
        the per-user daily/monthly quota in usage.py).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverLetterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoverLetterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CoverLetterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverLetterResponse'
          description: ''
  /api/ai/generate-summary:
    post:
      operationId: generate_summary
      description: |-
        Base for AI endpoints: auth required + a per-user burst throttle (complements
        the per-user daily/monthly quota in usage.py).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSummaryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GenerateSummaryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenerateSummaryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateSummaryResponse'
          description: ''
  /api/ai/improve-bullet:
    post:
      operationId: improve_bullet
      description: |-
        Base for AI endpoints: auth required + a per-user burst throttle (complements
        the per-user daily/monthly quota in usage.py).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImproveBulletRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImproveBulletRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImproveBulletRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImproveBulletResponse'
          description: ''
  /api/ai/parse-resume:
    post:
      operationId: parse_resume
      description: |-
        Base for AI endpoints: auth required + a per-user burst throttle (complements
        the per-user daily/monthly quota in usage.py).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseResumeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ParseResumeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ParseResumeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResumeResponse'
          description: ''
  /api/ai/tailor-jd:
    post:
      operationId: tailor_jd
      description: |-
        Base for AI endpoints: auth required + a per-user burst throttle (complements
        the per-user daily/monthly quota in usage.py).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TailorJDRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TailorJDRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TailorJDRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TailorJDResponse'
          description: ''
  /api/auth/login:
    post:
      operationId: login
      description: Obtain an access token via email + password; set the refresh cookie.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/logout:
    post:
      operationId: logout
      description: Blacklist the refresh token from the cookie, then clear the cookie.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me:
    get:
      operationId: get_me
      description: Return the currently authenticated user.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh:
    post:
      operationId: refresh_token
      description: Issue a new access token from the refresh cookie, rotating the
        cookie.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
  /api/auth/register:
    post:
      operationId: register
      description: Create an account; return the user + access token, set the refresh
        cookie.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/cover-letters/:
    get:
      operationId: list_cover_letters
      description: |-
        CRUD for the authenticated user's saved cover letters, scoped to
        request.user (cross-user access → 404). Optional ?resume= filter.
      parameters:
      - in: query
        name: resume
        schema:
          type: string
          format: uuid
        description: Filter to one résumé's letters.
      tags:
      - cover-letters
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoverLetter'
          description: ''
    post:
      operationId: create_cover_letter
      description: |-
        CRUD for the authenticated user's saved cover letters, scoped to
        request.user (cross-user access → 404). Optional ?resume= filter.
      tags:
      - cover-letters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverLetter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoverLetter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CoverLetter'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverLetter'
          description: ''
  /api/cover-letters/{id}/:
    get:
      operationId: get_cover_letter
      description: |-
        CRUD for the authenticated user's saved cover letters, scoped to
        request.user (cross-user access → 404). Optional ?resume= filter.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this cover letter.
        required: true
      tags:
      - cover-letters
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverLetter'
          description: ''
    patch:
      operationId: patch_cover_letter
      description: |-
        CRUD for the authenticated user's saved cover letters, scoped to
        request.user (cross-user access → 404). Optional ?resume= filter.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this cover letter.
        required: true
      tags:
      - cover-letters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCoverLetter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCoverLetter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCoverLetter'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverLetter'
          description: ''
    delete:
      operationId: delete_cover_letter
      description: |-
        CRUD for the authenticated user's saved cover letters, scoped to
        request.user (cross-user access → 404). Optional ?resume= filter.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this cover letter.
        required: true
      tags:
      - cover-letters
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/resumes/:
    get:
      operationId: list_resumes
      description: |-
        CRUD for the authenticated user's resumes, plus a duplicate action.
        All queries are scoped to request.user — a user can never see or touch
        another user's resume (returns 404).
      tags:
      - resumes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResumeList'
          description: ''
    post:
      operationId: create_resume
      description: |-
        CRUD for the authenticated user's resumes, plus a duplicate action.
        All queries are scoped to request.user — a user can never see or touch
        another user's resume (returns 404).
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resume'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Resume'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Resume'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
  /api/resumes/{id}/:
    get:
      operationId: get_resume
      description: |-
        CRUD for the authenticated user's resumes, plus a duplicate action.
        All queries are scoped to request.user — a user can never see or touch
        another user's resume (returns 404).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this resume.
        required: true
      tags:
      - resumes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
    put:
      operationId: update_resume
      description: |-
        CRUD for the authenticated user's resumes, plus a duplicate action.
        All queries are scoped to request.user — a user can never see or touch
        another user's resume (returns 404).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this resume.
        required: true
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resume'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Resume'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Resume'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
    patch:
      operationId: patch_resume
      description: |-
        CRUD for the authenticated user's resumes, plus a duplicate action.
        All queries are scoped to request.user — a user can never see or touch
        another user's resume (returns 404).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this resume.
        required: true
      tags:
      - resumes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedResume'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedResume'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedResume'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
    delete:
      operationId: delete_resume
      description: |-
        CRUD for the authenticated user's resumes, plus a duplicate action.
        All queries are scoped to request.user — a user can never see or touch
        another user's resume (returns 404).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this resume.
        required: true
      tags:
      - resumes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/resumes/{id}/duplicate/:
    post:
      operationId: duplicate_resume
      description: |-
        CRUD for the authenticated user's resumes, plus a duplicate action.
        All queries are scoped to request.user — a user can never see or touch
        another user's resume (returns 404).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this resume.
        required: true
      tags:
      - resumes
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
components:
  schemas:
    AIUsage:
      type: object
      description: Per-user AI usage snapshot (limits enforced in Phase 7).
      properties:
        calls_today:
          type: integer
        calls_this_month:
          type: integer
        daily_limit:
          type: integer
        monthly_limit:
          type: integer
        is_admin:
          type: boolean
      required:
      - calls_this_month
      - calls_today
      - daily_limit
      - is_admin
      - monthly_limit
    AtsCheckRequest:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/ResumeContent'
      required:
      - content
    AtsCheckResponse:
      type: object
      properties:
        score:
          type: integer
        issues:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        ai_usage:
          $ref: '#/components/schemas/AIUsage'
      required:
      - ai_usage
      - issues
      - recommendations
      - score
    AuthResponse:
      type: object
      description: |-
        Returned by register and login: the user plus a short-lived access token.
        The refresh token is set as an httpOnly cookie, not returned in the body.
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        access:
          type: string
          readOnly: true
      required:
      - access
      - user
    CoverLetter:
      type: object
      description: A saved cover letter attached to one of the caller's résumés.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resume:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 150
        body:
          type: string
          maxLength: 8000
        job_description:
          type: string
          maxLength: 8000
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - resume
      - title
      - updated_at
    CoverLetterRequest:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/ResumeContent'
        job_description:
          type: string
          maxLength: 8000
      required:
      - content
      - job_description
    CoverLetterResponse:
      type: object
      properties:
        cover_letter:
          type: string
        ai_usage:
          $ref: '#/components/schemas/AIUsage'
      required:
      - ai_usage
      - cover_letter
    Education:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
        school:
          type: string
          maxLength: 120
        degree:
          type: string
          maxLength: 120
        field:
          type: string
          maxLength: 120
        graduationDate:
          type: string
        gpa:
          type: string
          maxLength: 10
      required:
      - id
    EmailTokenObtainPair:
      type: object
      description: |-
        Login via email/password; returns the user alongside the token pair and
        keeps the admin flag in sync with ADMIN_EMAILS.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    GenerateSummaryRequest:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/ResumeContent'
      required:
      - content
    GenerateSummaryResponse:
      type: object
      properties:
        summary:
          type: string
        ai_usage:
          $ref: '#/components/schemas/AIUsage'
      required:
      - ai_usage
      - summary
    ImproveBulletRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 2000
        role:
          type: string
          maxLength: 120
      required:
      - text
    ImproveBulletResponse:
      type: object
      properties:
        suggestion:
          type: string
        ai_usage:
          $ref: '#/components/schemas/AIUsage'
      required:
      - ai_usage
      - suggestion
    ParseResumeRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 20000
      required:
      - text
    ParseResumeResponse:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/ResumeContent'
        ai_usage:
          $ref: '#/components/schemas/AIUsage'
      required:
      - ai_usage
      - content
    PatchedCoverLetter:
      type: object
      description: A saved cover letter attached to one of the caller's résumés.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resume:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 150
        body:
          type: string
          maxLength: 8000
        job_description:
          type: string
          maxLength: 8000
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedResume:
      type: object
      description: Full read + write representation of a resume (retrieve/create/update).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 100
        template:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        document_font:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        section_order:
          type: array
          items:
            type: string
            pattern: ^[-a-zA-Z0-9_]+$
          maxItems: 12
        content:
          $ref: '#/components/schemas/ResumeContent'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PersonalInfo:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        headline:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 40
        location:
          type: string
          maxLength: 100
        linkedin:
          type: string
          format: uri
        github:
          type: string
          format: uri
        website:
          type: string
          format: uri
    Project:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        technologies:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        url:
          type: string
          format: uri
      required:
      - id
    Register:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - name
      - password
    Resume:
      type: object
      description: Full read + write representation of a resume (retrieve/create/update).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 100
        template:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        document_font:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        section_order:
          type: array
          items:
            type: string
            pattern: ^[-a-zA-Z0-9_]+$
          maxItems: 12
        content:
          $ref: '#/components/schemas/ResumeContent'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - title
      - updated_at
    ResumeContent:
      type: object
      properties:
        personalInfo:
          $ref: '#/components/schemas/PersonalInfo'
        summary:
          type: string
          maxLength: 1000
        workExperience:
          type: array
          items:
            $ref: '#/components/schemas/WorkExperience'
        education:
          type: array
          items:
            $ref: '#/components/schemas/Education'
        skills:
          type: array
          items:
            type: string
            maxLength: 60
          maxItems: 60
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
      required:
      - education
      - personalInfo
      - skills
      - workExperience
    ResumeList:
      type: object
      description: |-
        Lightweight representation for the dashboard list — omits the heavy
        `content` blob, exposing only what resume cards render (incl. skills for
        the chips).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        template:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        skills:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - skills
      - template
      - title
      - updated_at
    TailorJDRequest:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/ResumeContent'
        job_description:
          type: string
          maxLength: 8000
      required:
      - content
      - job_description
    TailorJDResponse:
      type: object
      properties:
        match_score:
          type: integer
        missing_keywords:
          type: array
          items:
            type: string
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/TailorSuggestion'
        ai_usage:
          $ref: '#/components/schemas/AIUsage'
      required:
      - ai_usage
      - match_score
      - missing_keywords
      - suggestions
    TailorSuggestion:
      type: object
      properties:
        bullet_id:
          type: string
        current:
          type: string
        suggested:
          type: string
        adds:
          type: array
          items:
            type: string
      required:
      - adds
      - bullet_id
      - current
      - suggested
    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        is_admin:
          type: boolean
          readOnly: true
          description: 'App-level admin: bypasses AI usage limits.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        ai_usage:
          allOf:
          - $ref: '#/components/schemas/AIUsage'
          readOnly: true
      required:
      - ai_usage
      - created_at
      - email
      - id
      - is_admin
      - name
    WorkExperience:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
        company:
          type: string
          maxLength: 120
        position:
          type: string
          maxLength: 120
        location:
          type: string
          maxLength: 120
        startDate:
          type: string
        endDate:
          type: string
          nullable: true
        bullets:
          type: array
          items:
            type: string
            maxLength: 500
          maxItems: 12
      required:
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
