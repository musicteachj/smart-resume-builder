<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeIQ: AI resume builder</title>
    <meta
      name="description"
      content="Write a clean, ATS-safe résumé with AI help: sharpen every bullet, tailor it to any job, and export a polished PDF."
    />
    <!--
      The mark, from `docs/design/logo/`. The SVG switches ink with the browser's theme;
      Safari ignores SVG favicons and takes the PNG. The PNG is listed first and the SVG
      last, the order in which browsers that can draw an SVG icon choose it.
    -->
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FBFAF8" />

    <!-- Link previews (Slack, LinkedIn, iMessage). Scrapers need the absolute address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ResumeIQ" />
    <meta property="og:title" content="ResumeIQ: AI resume builder" />
    <meta property="og:description" content="The resume that writes itself well." />
    <meta property="og:url" content="https://resume.jameslittlefield.net/" />
    <meta property="og:image" content="https://resume.jameslittlefield.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ResumeIQ: The resume that writes itself well." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
