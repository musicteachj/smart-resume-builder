name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Postgres service credentials (match docker-compose.yml).
  DATABASE_URL: postgres://resume_user:resume_pass@localhost:5432/resume_builder

jobs:
  client:
    name: Client (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    name: Server (checks, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: resume_user
          POSTGRES_PASSWORD: resume_pass
          POSTGRES_DB: resume_builder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resume_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check --fail-level WARNING
      - name: Production deploy checks
        env:
          DEBUG: "False"
          SECRET_KEY: ci-deploy-check-key-that-is-long-and-random-enough-0123456789abcdef
          ALLOWED_HOSTS: resume.jameslittlefield.net
        run: python manage.py check --deploy --fail-level WARNING
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest

  api-schema:
    name: API schema (valid, client up to date)
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: pip install -r server/requirements.txt
      - run: npm ci
        working-directory: client
      - name: Generate and validate the OpenAPI schema
        run: python server/manage.py spectacular --validate --fail-on-warn --file client/openapi.yaml
      - name: Regenerate the Orval client
        run: npx orval
        working-directory: client
      - name: Committed client matches the backend
        run: |
          if [ -n "$(git status --porcelain -- client/openapi.yaml client/src/api/generated)" ]; then
            git status --short -- client/openapi.yaml client/src/api/generated
            git diff --stat -- client/openapi.yaml client/src/api/generated
            echo "::error::The generated API client is out of date. Run 'npm run gen:api' in client/ and commit the result."
            exit 1
          fi

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: resume_user
          POSTGRES_PASSWORD: resume_pass
          POSTGRES_DB: resume_builder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resume_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: smart-resume-builder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container (migrates, then gunicorn)
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DEBUG=False \
            -e SECRET_KEY=ci-smoke-test-key-that-is-long-and-random-enough-0123456789abcdef \
            -e ALLOWED_HOSTS=localhost \
            -e SECURE_SSL_REDIRECT=False \
            smart-resume-builder:ci
      - name: Health check and SPA are served
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"ok"'
          curl -fsS http://localhost:8000/ | grep -q 'id="root"'
          curl -fsS http://localhost:8000/dashboard | grep -q 'id="root"'
      - name: Container logs
        if: always()
        run: docker logs app || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Production dependencies only: dev tooling (Tailwind 3's build chain) has
      # advisories that never reach the shipped bundle.
      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: client
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r server/requirements.txt
