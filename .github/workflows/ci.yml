name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Runs for a pull request share a group, so a newer push cancels the older run. Each push to dev
# or main gets its own group, its commit, so no merge's run is ever canceled or left waiting.
# Only a pull request cancels: a run by hand on main shares the push run's group (same commit),
# and canceling that run could stop a deploy partway, mid-setup, which the deploy role cannot undo.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Postgres service credentials (match docker-compose.yml).
  DATABASE_URL: postgres://resume_user:resume_pass@localhost:5432/resume_builder

jobs:
  client:
    name: Client (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    name: Server (checks, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: resume_user
          POSTGRES_PASSWORD: resume_pass
          POSTGRES_DB: resume_builder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resume_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install --require-hashes -r requirements.txt
      - name: Django system checks
        run: python manage.py check --fail-level WARNING
      - name: Production deploy checks
        env:
          DEBUG: "False"
          SECRET_KEY: ci-deploy-check-key-that-is-long-and-random-enough-0123456789abcdef
          ALLOWED_HOSTS: resumeiq.jameslittlefield.net
        run: python manage.py check --deploy --fail-level WARNING
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest

  api-schema:
    name: API schema (valid, client up to date)
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: pip install --require-hashes -r server/requirements.txt
      - run: npm ci
        working-directory: client
      - name: Generate and validate the OpenAPI schema
        run: python server/manage.py spectacular --validate --fail-on-warn --file client/openapi.yaml
      - name: Regenerate the Orval client
        run: npx orval
        working-directory: client
      - name: Committed client matches the backend
        run: |
          if [ -n "$(git status --porcelain -- client/openapi.yaml client/src/api/generated)" ]; then
            git status --short -- client/openapi.yaml client/src/api/generated
            git diff --stat -- client/openapi.yaml client/src/api/generated
            echo "::error::The generated API client is out of date. Run 'npm run gen:api' in client/ and commit the result."
            exit 1
          fi

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: resume_user
          POSTGRES_PASSWORD: resume_pass
          POSTGRES_DB: resume_builder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resume_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: smart-resume-builder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container (migrates, then gunicorn)
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DEBUG=False \
            -e SECRET_KEY=ci-smoke-test-key-that-is-long-and-random-enough-0123456789abcdef \
            -e ALLOWED_HOSTS=localhost \
            -e SECURE_SSL_REDIRECT=False \
            -e DEMO_MODE=true \
            -e TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            -e TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA \
            smart-resume-builder:ci
      - name: Health check and SPA are served
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"ok"'
          curl -fsS http://localhost:8000/health/ready | grep -q '"ready"'
          curl -fsS http://localhost:8000/ | grep -q 'id="root"'
          curl -fsS http://localhost:8000/dashboard | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/auth/login)" = 404
          curl -fsS http://localhost:8000/api/demo/status | grep -q '"demo_mode":true'
      - name: Container logs
        if: always()
        run: docker logs app || true

  # End-to-end + accessibility (Playwright + axe, Chromium and WebKit). Not a required
  # check in branch protection, so it reports without blocking merges.
  e2e:
    name: E2E and accessibility (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: resume_user
          POSTGRES_PASSWORD: resume_pass
          POSTGRES_DB: resume_builder_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resume_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: client
    env:
      E2E_DATABASE_URL: postgres://resume_user:resume_pass@localhost:5432/resume_builder_e2e
      # The runner's Python has the server deps (no venv in CI).
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: pip install --require-hashes -r ../server/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Production dependencies only: dev tooling (Tailwind 3's build chain) has
      # advisories that never reach the shipped bundle.
      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: client
      - name: pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r server/requirements.txt --require-hashes

  # Builds the production image, pushes it to ECR, and deploys it to the shared portfolio server
  # (deploy/deploy.sh says how each step fails). It runs only on main, by a push or by hand
  # (workflow_dispatch redeploys the current commit), and only after every job above passed or was
  # skipped (!cancelled() replaces the implicit success(), which a skipped job would
  # fail). The `production` environment holds it for James's approval.
  deploy:
    name: Deploy to production
    needs: [client, server, api-schema, docker, e2e, audit]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    # The budget: the build and push (capped at 8 by their own timeout), a setup task's wait of up to
    # about 10, the wait for the service to settle of up to 30, the smoke checks (about 5 minutes at
    # most), and a minute for checkout, login and the guards.
    # Worst case: 8 + 10 + 30 + 5 + 1 = 54 minutes, so 58 leaves a little room. 58 is safe because the
    # OIDC credentials are taken about a minute into the job and last 1 hour (the default session
    # configure-aws-credentials asks for), so the job ends before they expire.
    timeout-minutes: 58
    environment: production
    permissions:
      contents: read
      id-token: write
    # One deploy at a time: this group never cancels a running deploy, and the workflow's own group
    # cancels only pull request runs. GitHub keeps at most one pending run per group, though, so a
    # newer run replaces an older pending one (a push can drop a redeploy by hand that is still
    # waiting for approval).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # "Re-run jobs" on an older run keeps that run's commit, and an older run approved late can
      # land after a newer one. Either would put old code over a newer release, so only the commit
      # at the head of main deploys. A run by hand on main starts from the head, so it passes.
      - name: Refuse a run that is not for the head of main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: deploy/head-of-main.sh

      # OIDC: the role trusts this repository's `production` environment and nothing else, so
      # no AWS key is stored anywhere.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/resumeiq-deploy
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      # Main can move while the job waits for approval or runs, so ask again right before the push: a
      # run refused here has pushed nothing, and costs no place in ECR's keep-5. Main can still move
      # during the build and push (measured 16 to 29 seconds on Packwright and Open Door); the newer run is then queued behind this one by
      # the deploy-production concurrency group, and deploys after it.
      - name: Refuse again, right before the push, if main moved
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: deploy/head-of-main.sh

      # The tag is the commit, the run and the attempt: a run by hand rebuilds the same commit, and
      # "Re-run jobs" keeps the run id, so the attempt makes each tag new. The ECR repository is
      # mutable, so a reused tag would overwrite the image an older task definition revision names.
      # It still starts with the commit, which portfolio-infra's revision check reads.
      # --provenance=false and --sbom=false keep buildx from pushing an image index with untagged
      # attestation manifests beside the image. ECR's scan on push and the keep-5 lifecycle rule both
      # need exactly one plain image manifest per tag.
      # Its own timeout (build and push together), so a slow or hung build fails here, before the
      # service is touched, instead of eating the time the settle wait and smoke checks need. 8 minutes
      # is generous headroom: builds and pushes measured 16 to 29 seconds on Packwright and Open Door.
      - name: Build and push the image
        timeout-minutes: 8
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/portfolio/resumeiq:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker buildx build --platform linux/amd64 --provenance=false --sbom=false --push -t "$IMAGE" .

      # Registers the three task definitions, runs the setup task, creates or updates the service,
      # waits for it to settle on this release, and runs the smoke checks.
      - name: Deploy
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/portfolio/resumeiq:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
          TARGET_GROUP_ARN: ${{ vars.TARGET_GROUP_ARN }}
        run: deploy/deploy.sh "$IMAGE"
